<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repartee — conversations by day</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>Conversations</h1>
      <div id="stats" class="muted">loading…</div>
    </header>

    <input id="search" type="search" placeholder="search transcripts…" autocomplete="off">

    <section>
      <h2>Days</h2>
      <ul id="days" class="days"></ul>
    </section>

    <footer class="muted">one row per recording · transcript + summary</footer>
  </aside>

  <main id="stage">
    <header id="stage-head">
      <h2 id="day-title">Select a day</h2>
      <div id="day-meta" class="muted"></div>
    </header>
    <div id="cards" class="cards"></div>
    <div id="empty" class="empty">No conversations yet.</div>
  </main>

  <aside id="detail" class="hidden">
    <button id="close" aria-label="close">×</button>
    <div id="detail-body"></div>
  </aside>

  <script src="/static/app.js"></script>
</body>
</html>
