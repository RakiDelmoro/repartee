[project]
name = "repartee-receiver"
version = "0.1.0"
description = "USB CDC receiver for the ESP32 conversation recorder"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Windows needs pyserial; Linux drives the raw tty directly.
receiver = ["pyserial>=3.5"]

[project.scripts]
repartee = "app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
