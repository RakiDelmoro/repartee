[project]
name = "repartee-receiver"
version = "0.1.0"
description = "USB CDC receiver for the ESP32 conversation recorder"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Windows needs pyserial; Linux drives the raw tty directly.
receiver = ["pyserial>=3.5"]
# Bigger-device STT. The LFM3-Omni checkpoint ships custom modeling code, so
# transformers must be new enough for AutoModelForMultimodalLM.
bigger = [
    "torch>=2.9",
    "transformers>=5.20.2",
    "accelerate>=1.0",
    "numpy>=2.0",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyyaml>=6.0",
]

[project.scripts]
repartee = "app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
