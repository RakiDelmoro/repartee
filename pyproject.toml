[project]
name = "repartee-ingest"
version = "0.1.0"
description = "Ingest, transcribe, summarise and index room-recorder conversations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "transformers>=5.13",
    "torch>=2.6",
    "soundfile>=0.12",
    "numpy>=2.0",
]

[project.scripts]
repartee = "app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
